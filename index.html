<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FFD93D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Colin记账" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Colin记账</title>
    <style>
      /* ============ 全局重置：消除默认边距、防止溢出与背景色穿透 ============ */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #F5F5F5;
      }
      #root {
        width: 100%;
        min-height: 100%;
      }
      /* 确保 React / antd 中间 wrapper 也继承高度 */
      #root > div {
        min-height: 100%;
      }

      /* ============ 移动端：锁定视口，禁止 body 滚动（页面内部自行处理滚动） ============ */
      @media (max-width: 767px) {
        html, body {
          height: 100%;
          overflow: hidden;
        }
        #root {
          height: 100%;
          min-height: 0;
        }
        #root > div {
          height: 100%;
          min-height: 0;
        }
      }

      /* ============ 统一滚动条样式 ============ */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d9d9d9;
        border-radius: 2px;
      }

      /* 图表页 Segmented 激活态：蓝底白字，加粗加长 */
      .stats-segmented-primary .ant-segmented-item {
        flex: 1;
        min-width: 0;
      }
      .stats-segmented-primary .ant-segmented-item-label {
        font-size: 16px;
        font-weight: 500;
        padding: 4px 0;
      }
      .stats-segmented-primary .ant-segmented-item-selected {
        background: #1677FF !important;
        border-radius: 6px;
      }
      .stats-segmented-primary .ant-segmented-item-selected .ant-segmented-item-label {
        color: #fff !important;
        font-weight: 600;
      }
      /* 隐藏周期滚动条 */
      .stats-period-scroll::-webkit-scrollbar {
        display: none;
      }

      /* ============ 登录页卡片入场动画 ============ */
      .login-card-enter {
        animation: loginSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes loginSlideUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
