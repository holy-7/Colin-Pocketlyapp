name: Build & Release Desktop

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build Desktop App (Windows)
        run: npm run package:win
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLAUDE_API_KEY: ${{ secrets.VITE_CLAUDE_API_KEY }}
          VITE_AI_API_BASE_URL: ${{ secrets.VITE_AI_API_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create ZIP archive
        run: |
          $tag = '${{ github.ref_name }}'
          Compress-Archive -Path release/*.exe, release/*.blockmap, release/latest.yml -DestinationPath "release/Colin记账-win-x64-$tag.zip"
        shell: pwsh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build Vite (macOS)
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLAUDE_API_KEY: ${{ secrets.VITE_CLAUDE_API_KEY }}
          VITE_AI_API_BASE_URL: ${{ secrets.VITE_AI_API_BASE_URL }}

      - name: Build Electron TS (macOS)
        run: npx tsc -p tsconfig.electron.json

      - name: Package macOS App
        run: |
          npx electron-builder --mac --publish=never 2>&1 | tee build-mac.log
          exit ${PIPESTATUS[0]}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log-${{ github.run_id }}
          path: build-mac.log
          retention-days: 1

      - name: Create ZIP archive
        run: |
          cd release
          ls -la
          zip -r "Colin记账-mac-arm64-${{ github.ref_name }}.zip" . -i '*.dmg' -i '*.blockmap' -i 'latest-mac.yml'

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            release/*.dmg
            release/*.blockmap
            release/latest-mac.yml
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
